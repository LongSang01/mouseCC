<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DAREU A950 Pro · WebHID 控制台</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #141b24;
        --line: #26313d;
        --text: #d7dee6;
        --dim: #7c8a99;
        --green: #39d353;
        --red: #f0625a;
        --accent: #00c2a8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "SF Mono", "Consolas", "Menlo", monospace;
        font-size: 14px;
        line-height: 1.5;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        font-size: 16px;
        letter-spacing: 0.04em;
        color: var(--accent);
        margin: 0 0 2px;
        text-transform: uppercase;
        text-align: center;
      }
      .sub {
        color: var(--dim);
        margin-bottom: 20px;
        font-size: 12px;
        text-align: center;
      }
      .container {
        width: 960px;
        max-width: 100%;
        margin: 0 auto;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 800px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 16px;
      }
      .panel h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 0 0 12px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      label {
        color: var(--dim);
        min-width: 64px;
        font-size: 12px;
      }
      input,
      select {
        background: #0a0f14;
        border: 1px solid var(--line);
        color: var(--text);
        padding: 6px 8px;
        border-radius: 4px;
        font-family: inherit;
        font-size: 13px;
      }
      select {
        width: 110px;
      }
      button {
        background: #1b2530;
        border: 1px solid var(--line);
        color: var(--text);
        padding: 7px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        color: #04211c;
        border-color: var(--accent);
        font-weight: 600;
      }
      button.primary:hover {
        color: #04211c;
        filter: brightness(1.1);
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--red);
        display: inline-block;
        margin-right: 6px;
      }
      .status-dot.on {
        background: var(--green);
      }
      .statline {
        display: flex;
        align-items: center;
        color: var(--dim);
        font-size: 12px;
        margin-bottom: 16px;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px dashed var(--line);
        font-size: 13px;
      }
      .kv span:last-child {
        color: var(--accent);
      }
      .full {
        grid-column: 1/-1;
      }
      #log {
        width: 100%;
        height: 240px;
        background: #0a0f14;
        border: 1px solid var(--line);
        color: var(--dim);
        font-family: inherit;
        font-size: 11.5px;
        padding: 10px;
        border-radius: 4px;
        resize: vertical;
        white-space: pre;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      #log::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      #log::-webkit-scrollbar-track {
        background: transparent;
      }
      #log::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 4px;
        border: 2px solid #0a0f14;
      }
      #log::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }
      input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input:disabled {
        opacity: 0.3;
      }
      #stages .stage-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      #stages .stage-row input[type="checkbox"] {
        width: auto;
        accent-color: var(--accent);
      }
      #stages .stage-row .stage-label {
        min-width: 44px;
      }
      #stages .stage-color {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid var(--line);
        display: inline-block;
        flex: none;
      }
      #stages .stage-name {
        color: var(--dim);
        font-size: 11px;
        flex: none;
      }
      #stages .dpi-wrap {
        position: relative;
        display: inline-block;
      }
      #stages .dpi-wrap input[type="number"] {
        padding-right: 20px;
        width: 80px;
      }
      #stages .dpi-wrap .spin {
        position: absolute;
        right: 1px;
        width: 19px;
        height: 50%;
        border: 0;
        border-left: 1px solid var(--line);
        background: #141b24;
        color: var(--dim);
        cursor: pointer;
        padding: 0;
        font-size: 8px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0;
      }
      #stages .dpi-wrap .spin:hover {
        background: var(--accent);
        color: #04211c;
      }
      #stages .dpi-wrap .spin.up {
        top: 1px;
        border-top-right-radius: 3px;
      }
      #stages .dpi-wrap .spin.down {
        bottom: 1px;
        border-bottom-right-radius: 3px;
        border-top: 1px solid var(--line);
      }
      #stages .dpi-wrap input:disabled ~ .spin {
        opacity: 0.3;
        pointer-events: none;
      }
      .hint {
        color: var(--dim);
        font-size: 11px;
        line-height: 1.6;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>DAREU A950 Pro &middot; WebHID 控制台</h1>
      <div class="sub">
        VID 0x260D &nbsp;/&nbsp; PID 0x1112(有线) · 0x1115(2.4G 接收器)
      </div>

      <div class="grid">
        <div class="panel">
          <h2>连接</h2>
          <div class="statline">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">未连接</span>
          </div>
          <div class="row">
            <button id="btnConnect" class="primary">连接设备</button>
            <button id="btnDisconnect" disabled>断开</button>
          </div>
          <div class="row">
            <label>设备信息</label>
            <input id="deviceInfo" value="--" disabled style="width: 260px" />
          </div>
        </div>

        <div class="panel">
          <h2>状态</h2>
          <div class="kv"><span>电量</span><span id="battVal">--</span></div>
          <div class="kv">
            <span>充电中</span><span id="chargeVal">--</span>
          </div>
          <div class="kv"><span>当前 DPI</span><span id="dpiVal">--</span></div>
          <div class="kv">
            <span>当前回报率</span><span id="pollVal">--</span>
          </div>
          <div class="row" style="margin-top: 12px">
            <button id="btnReadAll">刷新状态</button>
          </div>
        </div>

        <div class="panel">
          <h2>DPI 档位 (Stages)</h2>
          <div id="stages"></div>
          <div class="row" style="margin-top: 10px">
            <label>当前档位</label>
            <select id="activeStage"></select>
            <span id="stageSummary" class="hint"></span>
          </div>
          <div class="row" style="margin-top: 6px">
            <button id="btnSetStages" class="primary">写入档位配置</button>
            <button id="btnGetStages">读取档位配置</button>
          </div>
          <div class="hint">Jm 协议支持 1~7 档,颜色从设备读取(鼠标 DPI 按钮循环切换档位,LED 颜色随之变化)</div>
        </div>

        <div class="panel">
          <h2>回报率 (Polling Rate)</h2>
          <div class="row">
            <select id="pollRate">
              <option value="125">125 Hz</option>
              <option value="250">250 Hz</option>
              <option value="500">500 Hz</option>
              <option value="1000" selected>1000 Hz</option>
            </select>
          </div>
          <div class="row">
            <button id="btnSetPoll" class="primary">设置回报率</button>
            <button id="btnGetPoll">读取回报率</button>
          </div>
          <div class="hint">A950 Pro (TM2651KWL) 支持 <b>125 / 250 / 500 / 1000 Hz</b> 回报率</div>
        </div>

        <div class="panel full">
          <h2>原始通信日志</h2>
          <textarea id="log" readonly></textarea>
          <div class="row" style="margin-top: 8px">
            <button id="btnClearLog">清空日志</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        // ---- DAREU A950 Pro (Jm 协议, 已从 TM265.dll 逆向验证) ----
        // VID 0x260D, PID 0x1112(有线 TM265) / 0x1115(接收器 TM2651KDongle)
        // 控制集合 usagePage=0xFF02 usage=2, reportId=8, 16 字节
        // 传输: sendReport(REPORT_ID, 16B) 发送, inputreport 事件接收
        //   Chrome 对有鼠标/键盘集合的设备拒绝 sendFeatureReport,
        //   但 sendReport (output report) 不受此限制。
        // 帧: [0]=8(reportId) [1]=cmd [2]=? [3]=addrHi [4]=addrLo [5]=len
        //     [6..15]=数据 [16]=checksum
        // 校验和: cs = (85 - (sum(frame[0..15]) & 0xFF)) & 0xFF
        const VENDOR_IDS = [0x260d];
        const PRODUCT_IDS = [0x1112, 0x1115, 0x1114];

        const REPORT_ID = 8;
        const FRAME_SIZE = 17;
        const DATA_LEN = 10;

        let device = null;
        let inputListener = null;
        let pendingResolve = null;
        let pendingTimer = null;

        const $ = (id) => document.getElementById(id);
        const statusDot = $("statusDot");
        const statusText = $("statusText");
        const logBox = $("log");

        function log(msg) {
          const t = new Date().toLocaleTimeString();
          logBox.textContent += `[${t}] ${msg}\n`;
          logBox.scrollTop = logBox.scrollHeight;
        }

        function toHex(bytes) {
          return Array.from(bytes)
            .map((b) => b.toString(16).padStart(2, "0"))
            .join(" ");
        }

        function setConnected(connected) {
          statusDot.classList.toggle("on", connected);
          statusText.textContent = connected
            ? `已连接: ${device.productName || "DAREU A950 Pro"} (PID 0x${device.productId.toString(16).padStart(4, "0")})`
            : "未连接";
          $("btnConnect").disabled = connected;
          $("btnDisconnect").disabled = !connected;
          [
            "btnReadAll",
            "btnSetPoll",
            "btnGetPoll",
            "btnSetStages",
            "btnGetStages",
          ].forEach((id) => ($(id).disabled = !connected));
        }

        // ---- Jm 帧构建 (17 字节,含 reportId 前缀) ----
        function buildFrame(cmd, addr = 0, len = 0, data = []) {
          const a = new Uint8Array(FRAME_SIZE);
          a[0] = REPORT_ID;
          a[1] = cmd;
          a[3] = (addr >> 8) & 0xff;
          a[4] = addr & 0xff;
          a[5] = len & 0xff;
          a.set(data, 6);
          let sum = 0;
          for (let i = 0; i < 16; i++) sum += a[i];
          a[16] = (85 - (sum & 0xff)) & 0xff;
          return a;
        }

        // ---- 收发 ----
        // 发送: sendReport(REPORT_ID, 16B) 或 sendFeatureReport(0, 17B 全帧)
        // 接收: inputreport 事件 (设备通过 interrupt IN 回复)

        async function sendAndReceive(cmd, addr = 0, len = 0, data = [], waitMs = 300) {
          if (!device) throw new Error("设备未连接");
          const frame = buildFrame(cmd, addr, len, data);

          log(`TX cmd=0x${cmd.toString(16)} addr=0x${addr.toString(16).padStart(4, "0")} len=${len}`);
          log(`  raw: ${toHex(frame)}`);

          // 发送: 尝试 sendReport(REPORT_ID, 16B) → sendFeatureReport(0, 17B)
          try {
            await device.sendReport(REPORT_ID, frame.slice(1));
          } catch (e1) {
            log(`  sendReport 失败: ${e1.message}, 尝试 sendFeatureReport(0)...`);
            try {
              await device.sendFeatureReport(0, frame);
            } catch (e2) {
              throw new Error(`发送失败: ${e1.message} / ${e2.message}`);
            }
          }

          // 接收: 通过 inputreport 事件 (设备在 interrupt IN 上回复)
          // event.data 是 16 字节 payload (不含 reportId 前缀)
          const raw = await new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
              pendingResolve = null;
              reject(new Error("响应超时"));
            }, waitMs);
            pendingResolve = (data) => {
              clearTimeout(timer);
              pendingResolve = null;
              resolve(data);
            };
          });

          // 组装 17 字节全帧: [reportId=8, ...16B payload]
          const bytes = new Uint8Array(FRAME_SIZE);
          bytes[0] = REPORT_ID;
          bytes.set(raw.slice(0, 16), 1);

          log(`  RX(${raw.length}B): ${toHex(raw)}`);

          // 校验
          if (bytes[1] !== cmd) {
            log(`  ⚠️ 回显不符: expect cmd=0x${cmd.toString(16)}, got 0x${bytes[1].toString(16)}`);
          }
          return bytes;
        }

        // 解析: bytes = 17 字节全帧, payload 偏移同 Python
        // bytes[0]=reportId, bytes[1]=cmd, ..., bytes[6..15]=data, bytes[16]=cs
        function parseResp(bytes, expectCmd) {
          if (bytes[1] !== expectCmd)
            throw new Error(`命令回显不符: 期望 0x${expectCmd.toString(16)}, 收到 0x${bytes[1].toString(16)}`);
          return bytes;
        }

        // ---- 命令 ----
        // GetDeviceInfo cmd=1: 响应 bytes[10]=cid, [11]=mid, [12]=type
        async function getDeviceInfo() {
          const r = parseResp(await sendAndReceive(0x01, 0, 8), 0x01);
          const cid = r[10], mid = r[11], type = r[12];
          const typeName = type === 0 ? "2.4G 接收器" : type === 2 ? "有线鼠标" : `0x${type.toString(16)}`;
          $("deviceInfo").value = `cid=${cid} mid=${mid} type=${typeName}`;
          log(`设备信息: cid=${cid} mid=${mid} type=${typeName}`);
          return { cid, mid, type };
        }

        // CheckActive cmd=3: 响应 bytes[6]==1 激活
        async function checkActive() {
          const r = parseResp(await sendAndReceive(0x03), 0x03);
          return r[6] === 1;
        }

        // GetBattery cmd=4: 响应 bytes[6]=level, [7]=status
        async function getBattery() {
          const r = parseResp(await sendAndReceive(0x04), 0x04);
          const level = r[6];
          const status = r[7];
          const charging = status === 1 || status === 2;
          $("battVal").textContent = level > 0 ? `${level}%` : "--";
          $("chargeVal").textContent = status === 0 ? "否" : charging ? "是" : `未知(0x${status.toString(16)})`;
          log(`电量解析 = ${level}% (status=0x${status.toString(16)})`);
        }

        // GetFirmwareVer cmd=18: 响应 bytes[6]=verHi, [7]=verLo (格式 "{hi}.{lo:X2}")
        async function getFirmware() {
          const r = parseResp(await sendAndReceive(0x12), 0x12);
          const ver = `${r[6]}.${r[7].toString(16).toUpperCase()}`;
          log(`固件版本 v${ver}`);
          return ver;
        }

        // GetBuffer cmd=8: 发 addr/len, 响应 bytes[6..6+len-1]
        async function getBuffer(addr, len) {
          if (len > DATA_LEN) {
            const chunks = [];
            for (let off = 0; off < len; off += DATA_LEN) {
              const n = Math.min(DATA_LEN, len - off);
              chunks.push(...await getBuffer(addr + off, n));
            }
            return chunks;
          }
          const r = parseResp(await sendAndReceive(0x08, addr, len), 0x08);
          return Array.from(r.slice(6, 6 + len));
        }

        // SetBuffer cmd=7: 发 addr + data
        async function setBuffer(addr, data) {
          for (let off = 0; off < data.length; off += DATA_LEN) {
            const part = data.slice(off, off + DATA_LEN);
            parseResp(await sendAndReceive(0x07, addr + off, part.length, part), 0x07);
          }
        }

        // ---- 内存布局 ----
        // addr0: 回报率字节   addr2: 档位数   addr4: 当前档位-1
        // addr12+: 每档 4 字节 [keyLo,keyLo,keyHi,cs]
        const POLL_BYTE_TO_RATE = { 1: 1000, 2: 500, 4: 250, 8: 125 };
        const POLL_RATE_TO_BYTE = { 1000: 1, 500: 2, 250: 4, 125: 8 };

        // DPI 编码 (TM265 Dict)
        function dpiToKey(v) {
          if (v <= 12800) return v / 50 - 1;
          if (v <= 25600) return 0x4400 + (v / 50 - 257);
          return 0x8800 + (v / 50 - 513);
        }
        function keyToDpi(key) {
          if (key <= 255) return 50 * (key + 1);
          if (key >= 0x8800) return 50 * ((key & 0xff) + 513);
          return 50 * ((key & 0xff) + 257);
        }
        function dpiBlockBytes(key) {
          const lo = key & 0xff;
          const hi = key >> 8;
          const cs = (85 - (lo + lo + hi)) & 0xff;
          return [lo, lo, hi, cs];
        }

        // ---- DPI 档位 UI ----
        // DAREU A950 Pro 出厂默认颜色 (从设备 addr44 读取: 红/蓝/绿/黄/紫)
        const DEFAULT_STAGE_COLORS = ["#ff0000", "#0000ff", "#00ff00", "#ffff00", "#ff00ff", "#00ffff", "#ffffff"];
        const MAX_STAGES = 7;
        const STAGE_FILL = [400, 1300, 1600, 3200, 6400, 9600, 12800];
        let stageColors = [...DEFAULT_STAGE_COLORS]; // 会被设备实际数据覆盖

        const stagesEl = $("stages");
        const enBoxes = [];
        const dpiBoxes = [];
        const nameSpans = [];

        function buildStageRow(i) {
          const row = document.createElement("div");
          row.className = "stage-row";
          row.innerHTML = `
      <label class="stage-label"><input type="checkbox" class="stage-en">${i + 1}</label>
      <span class="dpi-wrap">
        <input type="number" class="stage-dpi" min="100" max="26000" step="50" value="${STAGE_FILL[i]}">
        <button type="button" class="spin up" title="+50">▲</button>
        <button type="button" class="spin down" title="-50">▼</button>
      </span>
      <span class="stage-color" data-stage="${i}" style="background:${stageColors[i]};"></span>
      <span class="stage-name"></span>`;
          const en = row.querySelector(".stage-en");
          const dpi = row.querySelector(".stage-dpi");
          enBoxes.push(en);
          dpiBoxes.push(dpi);
          nameSpans.push(row.querySelector(".stage-name"));
          dpi.addEventListener("change", () => stageDpi(i));
          dpi.addEventListener("blur", () => stageDpi(i));
          en.addEventListener("change", updateStageSummary);
          row.querySelector(".spin.up").addEventListener("click", () => stepStageDpi(i, 50));
          row.querySelector(".spin.down").addEventListener("click", () => stepStageDpi(i, -50));
          stagesEl.appendChild(row);
        }

        for (let i = 0; i < MAX_STAGES; i++) buildStageRow(i);

        const activeStageSel = $("activeStage");
        const stageSummary = $("stageSummary");

        function stageDpi(i) {
          const input = dpiBoxes[i];
          let v = parseInt(input.value, 10);
          if (Number.isNaN(v)) v = 100;
          v = Math.min(26000, Math.max(100, v));
          if (String(input.value) !== String(v)) input.value = v;
          return v;
        }

        function stepStageDpi(i, delta) {
          dpiBoxes[i].value = stageDpi(i) + delta;
          stageDpi(i);
        }

        function enabledStages() {
          const out = [];
          for (let i = 0; i < MAX_STAGES; i++) if (enBoxes[i].checked) out.push(i);
          return out;
        }

        function updateStageSummary() {
          const enabled = enabledStages();
          for (let i = 0; i < MAX_STAGES; i++) {
            const on = enabled.includes(i);
            dpiBoxes[i].disabled = !on;
            nameSpans[i].textContent = on ? "" : "(跳过)";
          }
          stageSummary.textContent = `共 ${enabled.length} 挡参与`;
          const cur = parseInt(activeStageSel.value, 10) || 1;
          activeStageSel.replaceChildren(
            ...Array.from({ length: enabled.length }, (_, s) =>
              Object.assign(document.createElement("option"), { value: String(s + 1), textContent: `${s + 1}` }),
            ),
          );
          if (cur <= enabled.length) activeStageSel.value = String(cur);
        }

        updateStageSummary();

        // 读取档位
        async function getDpiStages() {
          const head = await getBuffer(0, 10);
          const rateByte = head[0];
          const count = head[2];
          const active = head[4] + 1;
          log(`内存头部: rate=${rateByte}(${POLL_BYTE_TO_RATE[rateByte] || "?"}Hz) count=${count} active=${active}`);

          const stageKeys = [];
          if (count > 0) {
            const bytes = await getBuffer(12, count * 4);
            for (let i = 0; i < count; i++) {
              const key = bytes[i * 4 + 1] | (bytes[i * 4 + 2] << 8);
              stageKeys.push(key);
              log(`  档位${i + 1}: key=0x${key.toString(16)} → ${keyToDpi(key)} DPI`);
            }
          }

          // 读取档位颜色 (addr 44, 每档 4 字节 [R,G,B,checksum])
          stageColors = [...DEFAULT_STAGE_COLORS];
          if (count > 0) {
            const colorBytes = await getBuffer(44, count * 4);
            for (let i = 0; i < count; i++) {
              const r = colorBytes[i * 4];
              const g = colorBytes[i * 4 + 1];
              const b = colorBytes[i * 4 + 2];
              stageColors[i] = `#${r.toString(16).padStart(2, "0")}${g.toString(16).padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;
              log(`  颜色${i + 1}: RGB(${r},${g},${b}) ${stageColors[i]}`);
            }
          }

          for (let i = 0; i < MAX_STAGES; i++) {
            const on = i < count;
            enBoxes[i].checked = on;
            if (on) {
              dpiBoxes[i].value = keyToDpi(stageKeys[i]);
            } else {
              dpiBoxes[i].value = STAGE_FILL[i];
            }
            // 更新颜色指示器
            const colorDot = stagesEl.querySelector(`.stage-color[data-stage="${i}"]`);
            if (colorDot) colorDot.style.background = stageColors[i];
          }
          updateStageSummary();
          if (active >= 1 && active <= count) {
            activeStageSel.value = String(active);
            $("dpiVal").textContent = keyToDpi(stageKeys[active - 1]);
          }
          $("pollVal").textContent = POLL_BYTE_TO_RATE[rateByte] ? `${POLL_BYTE_TO_RATE[rateByte]} Hz` : "--";
        }

        // 写入档位
        async function setDpiStages() {
          const enabled = enabledStages();
          if (!enabled.length) { log("⚠️ 至少需要启用 1 个档位"); return; }
          const count = enabled.length;
          const active = Math.min(parseInt(activeStageSel.value, 10) || 1, count);
          const head = [count, (85 - count) & 0xff, active - 1, (85 - (active - 1)) & 0xff];
          await setBuffer(2, head);
          log(`档位头部写入: count=${count} active=${active}`);
          const blocks = [];
          for (const i of enabled) blocks.push(...dpiBlockBytes(dpiToKey(stageDpi(i))));
          await setBuffer(12, blocks);
          log(`档位数据写入`);

          // 写入档位颜色 (addr 44, 每档 4 字节 [R,G,B,checksum])
          const colorBlocks = [];
          for (const i of enabled) {
            const hex = stageColors[i] || DEFAULT_STAGE_COLORS[i] || "#ffffff";
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const cs = (85 - ((r + g + b) & 0xff)) & 0xff;
            colorBlocks.push(r, g, b, cs);
          }
          await setBuffer(44, colorBlocks);
          log(`颜色数据写入`);

          await getDpiStages();
        }

        // 回报率
        async function setPollRate(hz) {
          const byte = POLL_RATE_TO_BYTE[hz];
          if (byte === undefined) { log(`⚠️ ${hz}Hz 超出范围`); return; }
          await setBuffer(0, [byte, (85 - byte) & 0xff]);
          log(`回报率设置: ${hz}Hz`);
          await getPollRate();
        }

        async function getPollRate() {
          const b = await getBuffer(0, 1);
          const rate = POLL_BYTE_TO_RATE[b[0]];
          $("pollVal").textContent = rate ? `${rate} Hz` : `未知(0x${b[0].toString(16)})`;
          log(`回报率 = ${rate ? rate + "Hz" : "未知"} (byte=0x${b[0].toString(16)})`);
        }

        // ---- 连接 ----
        function findJmCollection(d) {
          return (d.collections || []).find(c => c.usagePage === 0xff02 && c.usage === 2);
        }

        $("btnConnect").addEventListener("click", async () => {
          try {
            const collected = [];
            const merge = (devices) => {
              for (const d of devices) {
                if (!VENDOR_IDS.includes(d.vendorId)) continue;
                if (PRODUCT_IDS.length && !PRODUCT_IDS.includes(d.productId)) continue;
                if (!collected.includes(d)) collected.push(d);
              }
            };

            try {
              merge(await navigator.hid.requestDevice({
                filters: PRODUCT_IDS.map(pid => ({ vendorId: VENDOR_IDS[0], productId: pid })),
              }));
            } catch (e) {}
            merge(await navigator.hid.getDevices());

            if (!collected.length) {
              log("未获得任何接口授权,请重试");
              return;
            }

            log(`枚举到 ${collected.length} 个 HID device`);

            // 优先带 Jm 控制集合的接口
            const candidates = collected.slice().sort(
              (a, b) => (findJmCollection(b) ? 1 : 0) - (findJmCollection(a) ? 1 : 0),
            );

            let chosen = null;
            let chosenInfo = null;
            for (const d of candidates) {
              try {
                if (!d.opened) await d.open();
                const jmCol = findJmCollection(d);
                if (!jmCol) {
                  log(`  跳过 ${d.productName}(0x${d.productId.toString(16)}): 无 Jm 控制集合`);
                  if (d.opened) await d.close();
                  continue;
                }
                log(`  尝试 ${d.productName}(0x${d.productId.toString(16)}): Jm 集合=${jmCol.usagePage.toString(16)}/${jmCol.usage.toString(16)}`);
                device = d;
                // 注册 inputreport 监听 (设备通过 interrupt IN 回复)
                inputListener = (e) => {
                  if (e.reportId !== REPORT_ID) return;
                  const data = new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength);
                  if (pendingResolve) {
                    const r = pendingResolve;
                    pendingResolve = null;
                    r(data);
                  }
                };
                d.addEventListener("inputreport", inputListener);
                const info = await getDeviceInfo();
                if (info.cid === 10 && info.mid === 1) {
                  chosen = d;
                  chosenInfo = info;
                  break;
                }
                log(`  跳过: cid=${info.cid} mid=${info.mid}`);
                device = null;
                if (inputListener) { d.removeEventListener("inputreport", inputListener); inputListener = null; }
                if (d.opened) await d.close();
              } catch (e) {
                log(`  尝试 ${d.productName}: ${e.message}`);
                device = null;
                if (inputListener) { d.removeEventListener("inputreport", inputListener); inputListener = null; }
                try { if (d.opened) await d.close(); } catch (e2) {}
              }
            }

            if (!chosen) {
              device = null;
              log("未找到可用的 Jm 控制接口,请检查后重试。");
              return;
            }

            device = chosen;
            log(`已连接: ${device.productName} (PID 0x${device.productId.toString(16).padStart(4, "0")} · type=${chosenInfo.type})`);
            setConnected(true);

            const active = await checkActive();
            if (!active) {
              log("⚠️ 2.4G 鼠标当前未连接到接收器,固件/电量/DPI 需鼠标在线后点「刷新状态」");
            } else {
              log(`设备激活 (CheckActive=1)`);
              await getFirmware();
              refreshStatus();
            }
          } catch (e) {
            log(`连接失败: ${e.message}`);
          }
        });

        $("btnDisconnect").addEventListener("click", async () => {
          if (device) {
            try {
              if (inputListener) device.removeEventListener("inputreport", inputListener);
              await device.close();
            } catch (e) {}
            log("设备已断开");
          }
          device = null;
          inputListener = null;
          pendingResolve = null;
          setConnected(false);
        });

        async function refreshStatus() {
          try {
            await getBattery();
            await getDpiStages();
          } catch (e) {
            log(`刷新失败: ${e.message}`);
          }
        }

        function bindAction(id, action, failMsg) {
          $(id).addEventListener("click", async () => {
            try { await action(); } catch (e) { log(`${failMsg}: ${e.message}`); }
          });
        }

        bindAction("btnReadAll", refreshStatus, "刷新失败");
        bindAction("btnSetStages", setDpiStages, "写入档位失败");
        bindAction("btnGetStages", getDpiStages, "读取档位失败");
        bindAction("btnGetPoll", getPollRate, "读取回报率失败");
        bindAction("btnSetPoll", () => setPollRate(parseInt($("pollRate").value, 10)), "设置回报率失败");

        $("btnClearLog").addEventListener("click", () => { logBox.textContent = ""; });

        if (!("hid" in navigator)) {
          log("⚠️ 当前浏览器不支持 WebHID API,请使用桌面版 Chrome / Edge。");
        } else {
          log("就绪。点击「连接设备」开始。");
        }
      })();
    </script>
  </body>
</html>
